name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g. v1.0.0)'
        required: false
        default: 'latest'
  push:
    branches: [ main, master ]

permissions:
  contents: write

env:
  PATCH_FILENAME: Assembly-CSharp-patch.bytes

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build the IFix patch bytes
  # ---------------------------------------------------------------------------
  build-patch:
    name: Build ESP Patch
    runs-on: macos-latest
    outputs:
      patch_sha256: ${{ steps.build.outputs.patch_sha256 }}
      game_version: ${{ steps.build.outputs.game_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Mono (C# compiler for macOS)
        run: |
          brew install mono

      - name: Verify build prerequisites
        run: |
          echo "=== Checking tools ==="
          which python3 && python3 --version
          which mcs && mcs --version
          echo "=== Checking project files ==="
          ls -la baseline/ || true
          ls -la baseline/DummyDll/ || true
          ls -la vendor/InjectFix/ThirdParty/ || true
          ls -la src/ || true
          ls -la tools/ || true
          ls -la dumps/ || true

      - name: Build patch (ESP-only)
        id: build
        shell: pwsh
        run: |
          ./build.ps1 -KeepBuildArtifacts
          $manifest = Get-Content -LiteralPath dist/Assembly-CSharp-patch.manifest.json -Raw | ConvertFrom-Json
          echo "patch_sha256=$($manifest.sha256)" >> $env:GITHUB_OUTPUT
          echo "game_version=$($manifest.game_version)" >> $env:GITHUB_OUTPUT
          echo "=== Build Summary ==="
          echo "Version: $($manifest.game_version)"
          echo "Size: $($manifest.size) bytes"
          echo "SHA256: $($manifest.sha256)"
          echo "Features: $($manifest.features -join ', ')"

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-patch
          path: |
            dist/Assembly-CSharp-patch.bytes
            dist/Assembly-CSharp-patch.manifest.json
            dist/Assembly-CSharp-patch.report.json
            dist/Assembly-CSharp-patch.verify.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 2: Package into .ipa
  # ---------------------------------------------------------------------------
  package-ipa:
    name: Package IPA
    runs-on: macos-latest
    needs: build-patch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download patch artifact
        uses: actions/download-artifact@v4
        with:
          name: esp-patch
          path: dist/

      - name: Prepare IPA structure
        run: |
          echo "=== Creating IPA directory structure ==="
          mkdir -p Payload/GameApp.app/Data/Managed

          cp dist/Assembly-CSharp-patch.bytes \
             Payload/GameApp.app/Data/Managed/Assembly-CSharp-patch.bytes

          cp dist/Assembly-CSharp-patch.manifest.json \
             Payload/GameApp.app/Data/Managed/patch-manifest.json

          echo "=== IPA Contents ==="
          find Payload -type f | head -20

      - name: Build IPA archive
        run: |
          VERSION="${{ needs.build-patch.outputs.game_version }}"
          HASH="${{ needs.build-patch.outputs.patch_sha256 }}"
          SHORT_HASH="${HASH:0:8}"
          IPA_NAME="ESP-Patch-v${VERSION}-${SHORT_HASH}.ipa"

          zip -r "${IPA_NAME}" Payload/
          echo "ipa_name=${IPA_NAME}" >> $GITHUB_ENV
          echo "=== IPA Created ==="
          ls -la "${IPA_NAME}"
          echo "File: ${IPA_NAME}"
          echo "Size: $(stat -f%z "${IPA_NAME}") bytes"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.ipa_name }}
          retention-days: 90

      - name: Upload patch-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-bytes
          path: dist/Assembly-CSharp-patch.bytes
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 3: Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-patch, package-ipa]
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release/

      - name: Download patch artifact
        uses: actions/download-artifact@v4
        with:
          name: esp-patch
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || format('v{0}', needs.build-patch.outputs.game_version) }}
          name: "ESP Patch ${{ needs.build-patch.outputs.game_version }}"
          body: |
            ## ESP-Only Visual Patch

            **Game Version:** `${{ needs.build-patch.outputs.game_version }}`
            **Patch SHA256:** `${{ needs.build-patch.outputs.patch_sha256 }}`

            ### Features
            - ✅ ESP Box
            - ✅ ESP Tracer
            - ✅ ESP Health Bar
            - ✅ ESP Player Name
            - ✅ ESP Distance
            - ✅ Three-finger five-tap menu

            ### Removed
            - ❌ Silent Aim
            - ❌ Aim System
            - ❌ No Recoil
            - ❌ Fast Parachute
            - ❌ Speed Running
          files: |
            release/*.ipa
            release/Assembly-CSharp-patch.bytes
            release/Assembly-CSharp-patch.manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
